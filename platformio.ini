[platformio]
default_envs = esp32-c3-supermini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13

[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
build_flags =
  -D OLED_SDA_PIN=8
  -D OLED_SCL_PIN=9
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-devkit]
board = esp32dev
build_flags =
  -D OLED_SDA_PIN=21
  -D OLED_SCL_PIN=22

[env:esp32-devkit-classic-bt]
board = esp32dev
build_flags =
  -D OLED_SDA_PIN=21
  -D OLED_SCL_PIN=22
  -D USE_CLASSIC_BT=1

[env:esp32-s3-devkit]
board = esp32-s3-devkitc-1
build_flags =
  -D OLED_SDA_PIN=8
  -D OLED_SCL_PIN=9
