name: Build and Deploy Web Flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run
      - name: Prepare web flasher
        shell: bash
        run: |
          set -euo pipefail
          env_name=esp32-c3-supermini
          build_dir=".pio/build/$env_name"
          site_dir="dist"
          mkdir -p "$site_dir/firmware"
          cp web/index.html "$site_dir/index.html"
          cp "$build_dir/bootloader.bin" "$site_dir/firmware/bootloader.bin"
          cp "$build_dir/partitions.bin" "$site_dir/firmware/partitions.bin"
          cp "$build_dir/firmware.bin" "$site_dir/firmware/firmware.bin"
          cat > "$site_dir/firmware/manifest.json" <<'EOF'
          {
            "name": "ESP32-C3 SuperMini OLED BLE",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
