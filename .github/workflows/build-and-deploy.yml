name: Build and Deploy Web Flasher & Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 0. Setup — install PlatformIO once, cache for all matrix board jobs
  # =========================================================================
  setup:
    name: Install & Cache PlatformIO Core
    runs-on: ubuntu-latest
    outputs:
      pio-cache-key: ${{ steps.pio-cache-key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute PlatformIO cache key
        id: pio-cache-key
        run: echo "key=pio-core-${{ runner.os }}-${{ hashFiles('platformio.ini') }}" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO Core & Toolchains
        id: cache-pio
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ steps.pio-cache-key.outputs.key }}
          restore-keys: |
            pio-core-${{ runner.os }}-

      - name: Set up Python for PlatformIO
        if: steps.cache-pio.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        if: steps.cache-pio.outputs.cache-hit != 'true'
        run: python -m pip install --upgrade platformio

  # =========================================================================
  # 1. Build ESP32 Firmwares (Parallel Matrix — restores PlatformIO from setup)
  # =========================================================================
  build-firmware:
    name: Build ESP32 Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32-c3-supermini
          - esp32-devkit
          - esp32-devkit-classic-bt
          - esp32-s3-devkit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restore PlatformIO toolchains built by the setup job — no save step.
      - name: Restore PlatformIO Core & Toolchains
        uses: actions/cache/restore@v4
        with:
          path: ~/.platformio
          key: ${{ needs.setup.outputs.pio-cache-key }}
          restore-keys: |
            pio-core-${{ runner.os }}-

      # Cache compiled firmware binaries with EXACT source hash (NO restore-keys to avoid stale binaries!)
      - name: Cache Compiled Firmware Binaries
        id: cache-firmware
        uses: actions/cache@v4
        with:
          path: |
            .pio/build/${{ matrix.board }}/bootloader.bin
            .pio/build/${{ matrix.board }}/partitions.bin
            .pio/build/${{ matrix.board }}/firmware.bin
          key: pio-bins-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('platformio.ini', 'src/**', 'include/**', 'lib/**') }}

      - name: Check cached firmware binaries
        id: check-firmware
        shell: bash
        run: |
          if [ "${{ steps.cache-firmware.outputs.cache-hit }}" == "true" ] && \
             [ -f .pio/build/${{ matrix.board }}/firmware.bin ]; then
            echo "Exact cache hit for ${{ matrix.board }}. Skipping compilation!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Binaries missing or source modified for ${{ matrix.board }}. Running full build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python for PlatformIO
        if: steps.check-firmware.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build firmware for target
        if: steps.check-firmware.outputs.skip != 'true'
        run: pio run -e ${{ matrix.board }}

      - name: Prepare firmware artifacts
        shell: bash
        run: |
          mkdir -p "dist-firmware/${{ matrix.board }}"
          cp ".pio/build/${{ matrix.board }}/bootloader.bin" "dist-firmware/${{ matrix.board }}/"
          cp ".pio/build/${{ matrix.board }}/partitions.bin" "dist-firmware/${{ matrix.board }}/"
          cp ".pio/build/${{ matrix.board }}/firmware.bin" "dist-firmware/${{ matrix.board }}/"

      - name: Upload firmware binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ matrix.board }}
          path: dist-firmware/${{ matrix.board }}
          retention-days: 7

  # =========================================================================
  # 2. Build Android App (Runs in Parallel, Caches & Skips if Unchanged)
  # =========================================================================
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache Release APK with EXACT source hash (NO restore-keys to avoid stale APKs!)
      - name: Cache Android Release APK
        id: cache-apk
        uses: actions/cache@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: android-release-apk-${{ runner.os }}-${{ hashFiles('android/**') }}

      - name: Check cached APK
        id: check-apk
        shell: bash
        run: |
          if [ "${{ steps.cache-apk.outputs.cache-hit }}" == "true" ] && \
             [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Exact cache hit for Android sources. Skipping Gradle build!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cache miss or Android source modified. Building fresh Release APK."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check-apk.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: steps.check-apk.outputs.skip != 'true'
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        if: steps.check-apk.outputs.skip != 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-google-maps-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # =========================================================================
  # 3. Aggregate Artifacts & Deploy to GitHub Pages
  # =========================================================================
  deploy:
    name: Package & Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-firmware, build-android]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware - esp32-c3-supermini
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-esp32-c3-supermini
          path: downloaded-firmware/esp32-c3-supermini

      - name: Download firmware - esp32-devkit
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-esp32-devkit
          path: downloaded-firmware/esp32-devkit

      - name: Download firmware - esp32-devkit-classic-bt
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-esp32-devkit-classic-bt
          path: downloaded-firmware/esp32-devkit-classic-bt

      - name: Download firmware - esp32-s3-devkit
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-esp32-s3-devkit
          path: downloaded-firmware/esp32-s3-devkit

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-google-maps-apk
          path: downloaded-apk

      - name: Assemble GitHub Pages site distribution
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          site_dir="dist"
          mkdir -p "$site_dir/firmware" "$site_dir/apk"

          # 1. Copy web flasher UI
          cp web/index.html "$site_dir/index.html"
          build_date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          app_version=$(tr -d '[:space:]' < VERSION)
          printf '{"commit":"%s","builtAt":"%s","appVersion":"%s"}\n' "${BUILD_COMMIT:0:7}" "$build_date" "$app_version" > "$site_dir/commit.json"

          # 2. Copy Android APK (both versioned filename and generic fallback)
          cp downloaded-apk/app-release.apk "$site_dir/apk/esp32-google-maps-v${app_version}.apk"
          cp downloaded-apk/app-release.apk "$site_dir/apk/esp32-google-maps.apk"
          echo "Successfully placed APK at $site_dir/apk/esp32-google-maps-v${app_version}.apk and $site_dir/apk/esp32-google-maps.apk"

          # 3. Copy firmware binaries and generate manifests
          write_manifest() {
            local env_name="$1" device_name="$2" chip_family="$3"
            local src_dir="downloaded-firmware/$1" out_dir="$site_dir/firmware/$1"
            mkdir -p "$out_dir"
            cp "$src_dir/bootloader.bin" "$out_dir/bootloader.bin"
            cp "$src_dir/partitions.bin" "$out_dir/partitions.bin"
            cp "$src_dir/firmware.bin" "$out_dir/firmware.bin"
            cat > "$out_dir/manifest.json" <<EOF
          {
            "name": "$device_name",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "$chip_family",
              "parts": [
                { "path": "bootloader.bin", "offset": 0 },
                { "path": "partitions.bin", "offset": 32768 },
                { "path": "firmware.bin", "offset": 65536 }
              ]
            }]
          }
          EOF
          }

          write_manifest esp32-c3-supermini "ESP32-C3 SuperMini OLED BLE (GPIO 8/9)" ESP32-C3
          write_manifest esp32-devkit "Classic ESP32 OLED BLE (GPIO 21/22)" ESP32
          write_manifest esp32-devkit-classic-bt "Classic ESP32 OLED Bluetooth Classic (GPIO 21/22)" ESP32
          write_manifest esp32-s3-devkit "ESP32-S3 OLED BLE (GPIO 8/9)" ESP32-S3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
